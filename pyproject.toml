[project]
name = "radaropcoes-mcp"
version = "0.1.0"
description = "Servidor MCP da API Tesouro Direto do Radar Opções"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
radaropcoes-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
